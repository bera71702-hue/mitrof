<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Мой сайт</title>
<style>
  :root {
    --bg: #0f0f12; --panel: #1a1a21; --border: #2a2a35;
    --text: #e8e8f0; --muted: #8888a0; --accent: #c9a227;
    --accent-hover: #e0b830; --error: #e05555; --success: #4caf7d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .container {
    width: 100%; max-width: 420px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 32px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 8px; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  label {
    display: block; font-size: 0.75rem; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  input {
    width: 100%; padding: 12px 14px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 0.95rem; outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 12px; background: var(--accent); color: #111;
    border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s; margin-top: 8px;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .toggle {
    text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted);
  }
  .toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .toggle a:hover { text-decoration: underline; }
  .message {
    padding: 10px 14px; border-radius: 8px; font-size: 0.85rem;
    margin-bottom: 16px; display: none;
  }
  .message.error { display: block; background: rgba(224,85,85,0.1); color: var(--error); border: 1px solid rgba(224,85,85,0.3); }
  .message.success { display: block; background: rgba(76,175,125,0.1); color: var(--success); border: 1px solid rgba(76,175,125,0.3); }
  .hidden { display: none !important; }
  .user-card {
    padding: 16px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 16px;
  }
  .user-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .user-card .value { font-size: 1rem; margin-top: 4px; word-break: break-all; }
  .loader { text-align: center; padding: 40px 0; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">

  <!-- Loading -->
  <div id="loading-view"><div class="loader">Загрузка…</div></div>

  <!-- Login -->
  <div id="login-view" class="hidden">
    <h1>Вход</h1>
    <p class="subtitle">Войди в свой аккаунт.</p>
    <div id="login-message" class="message"></div>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="login-password" required autocomplete="current-password" />
      </div>
      <button type="submit">Войти</button>
    </form>
    <div class="toggle">Нет аккаунта? <a id="to-register">Регистрация</a></div>
  </div>

  <!-- Register -->
  <div id="register-view" class="hidden">
    <h1>Регистрация</h1>
    <p class="subtitle">Создай новый аккаунт.</p>
    <div id="register-message" class="message"></div>
    <form id="register-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="register-email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Пароль (мин. 8 символов)</label>
        <input type="password" id="register-password" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit">Создать аккаунт</button>
    </form>
    <div class="toggle">Уже есть аккаунт? <a id="to-login">Войти</a></div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard-view" class="hidden">
    <h1>Ты в системе</h1>
    <p class="subtitle">Защищённая страница.</p>
    <div class="user-card">
      <div class="label">Вы вошли как</div>
      <div class="value" id="dashboard-email">—</div>
    </div>
    <button id="logout-btn">Выйти</button>
  </div>

</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  function show(id) {
    document.querySelectorAll('[id$="-view"]').forEach(el => el.classList.add('hidden'));
    $(id).classList.remove('hidden');
  }

  function showMsg(id, text, type) {
    const el = $(id);
    el.textContent = text;
    el.className = 'message ' + type;
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Ошибка запроса');
    return data;
  }

  // Проверка сессии при загрузке страницы
  async function bootstrap() {
    try {
      const { user } = await api('/api/me');
      if (user) {
        $('dashboard-email').textContent = user.email;
        show('dashboard-view');
        return;
      }
    } catch (_) { /* не авторизован — это нормально */ }
    show('login-view');
  }

  // Переключение форм
  $('to-register').onclick = () => show('register-view');
  $('to-login').onclick = () => show('login-view');

  // Регистрация
  $('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const data = await api('/api/register', {
  method: 'POST',
  body: JSON.stringify({
    email: $('register-email').value,
    password: $('register-password').value,
  }),
});
showMsg('register-message', data.message || 'Аккаунт создан. Проверь почту.', 'success');
      setTimeout(() => {
        $('login-email').value = $('register-email').value;
        show('login-view');
      }, 900);
    } catch (err) {
      showMsg('register-message', err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  // Вход
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const { user } = await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({
          email: $('login-email').value,
          password: $('login-password').value,
        }),
      });
      $('dashboard-email').textContent = user.email;
      $('login-password').value = '';
      show('dashboard-view');
    } catch (err) {
      showMsg('login-message', err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  // Выход
  $('logout-btn').addEventListener('click', async () => {
    try { await api('/api/logout', { method: 'POST', body: '{}' }); } catch (_) {}
    show('login-view');
  });
  // ... выше идут все остальные функции и обработчики ...

  async function bootstrap() {
    const params = new URLSearchParams(location.search);
    if (params.get('verified') === '1') {
      show('login-view');
      showMsg('login-message', 'Email подтверждён! Теперь можешь войти.', 'success');
      history.replaceState({}, '', '/');
    }

    try {
      const { user } = await api('/api/me');
      if (user) {
        $('dashboard-email').textContent = user.email;
        show('dashboard-view');
        return;
      }
    } catch (_) { /* не авторизован — это нормально */ }
    show('login-view');
  }

  bootstrap();
})();
</script>
</body>
</html>
